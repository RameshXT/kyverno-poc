apiVersion: apps/v1
kind: Deployment
metadata:
  name: probes-bridge
  namespace: poc-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: probes-bridge
  template:
    metadata:
      labels:
        app: probes-bridge
      annotations:
        smaitic.com/inject-secrets-poc: "probes-bridge"
        smaitic.com/health-config: "bridge"
    spec:
      containers:
        - name: app
          image: busybox:latest
          command: ["sleep", "3600"]
          ports:
            - containerPort: 9988
