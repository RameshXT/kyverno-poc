apiVersion: apps/v1
kind: Deployment
metadata:
  name: unannotated
  namespace: policy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: unannotated
  template:
    metadata:
      labels:
        app: unannotated
    spec:
      containers:
        - name: app
          image: busybox:latest
          command: ["sleep", "3600"]
