apiVersion: batch/v1
kind: CronJob
metadata:
  name: poc-cronjob-1min
  namespace: policy
  annotations:
    smaitic.com/inject-secrets-poc: "poc-cronjob-1min"
spec:
  schedule: "*/1 * * * *"
  jobTemplate:
    spec:
      template:
        metadata:
          annotations:
            smaitic.com/inject-secrets-poc: "poc-cronjob-1min"
        spec:
          restartPolicy: Never
          containers:
            - name: cron-worker
              image: busybox:latest
              command: ["java", "-jar", "app.jar"]
