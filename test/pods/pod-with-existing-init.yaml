apiVersion: v1
kind: Pod
metadata:
  name: pod-with-existing-init
  namespace: policy
  annotations:
    smaitic.com/inject-secrets-poc: "pod-with-existing-init"
spec:
  initContainers:
    - name: my-app-init
      image: busybox:latest
      command: ["/bin/sh", "-c", "echo 'my-app-init running' && sleep 1"]
  containers:
    - name: dummy-app
      image: busybox:latest
      command: ["/bin/sh", "-c", "sleep 3600"]
