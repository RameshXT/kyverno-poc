apiVersion: v1
kind: Pod
metadata:
  name: demo-02-existing-init-ordering
  namespace: {{ .Release.Namespace }}
  annotations:
    {{ .Values.annotationKey }}: "demo-02-existing-init-ordering"
spec:
  initContainers:
    - name: custom-app-init
      image: {{ .Values.app.image }}
      command: ["/bin/sh", "-c", "echo 'custom app init running' && sleep 1"]
  containers:
    - name: app
      image: {{ .Values.app.image }}
      command: ["sleep", "3600"]
