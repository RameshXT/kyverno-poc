apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-07-init-parser-cmd
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-07-init-parser-cmd
  template:
    metadata:
      labels:
        app: demo-07-init-parser-cmd
      annotations:
        # Scenario: init-parser command prepend.
        # Expected: Kyverno prepends /scripts/init_parser.sh at command[0].
        {{ .Values.annotationKey }}: "demo-07-init-parser-cmd"
        smaitic.com/launcher-script: "init-parser"
    spec:
      containers:
        - name: app
          image: {{ .Values.app.image }}
          command: ["sleep", "3600"]
