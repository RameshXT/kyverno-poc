apiVersion: apps/v1
kind: Deployment
metadata:
  name: unannotated
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: unannotated
  template:
    metadata:
      labels:
        app: unannotated
    spec:
      containers:
        - name: app
          image: {{ .Values.app.image }}
          command: ["sleep", "3600"]
