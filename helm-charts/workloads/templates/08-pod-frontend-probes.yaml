apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-05-frontend-probes
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-05-frontend-probes
  template:
    metadata:
      labels:
        app: demo-05-frontend-probes
      annotations:
        # Scenario: nginx-static health probe injection.
        # Expected: Kyverno injects liveness + readiness probes on port 8080
        #           with path / (static frontend served by Nginx).
        {{ .Values.annotationKey }}: "demo-05-frontend-probes"
        smaitic.com/kyverno/health-config: "nginx-static"
    spec:
      containers:
        - name: app
          image: {{ .Values.app.image }}
          command: ["sleep", "3600"]
          ports:
            - containerPort: 8080
