apiVersion: apps/v1
kind: Deployment
metadata:
  name: init-ordering
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: init-ordering
  template:
    metadata:
      labels:
        app: init-ordering
      annotations:
        {{ .Values.annotationKey }}: "init-ordering"
    spec:
      initContainers:
        - name: custom-app-init
          image: {{ .Values.app.image }}
          command: ["/bin/sh", "-c", "echo 'custom app init running' && sleep 1"]
      containers:
        - name: app
          image: {{ .Values.app.image }}
          command: ["sleep", "3600"]
