apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: inject-secrets-manager
spec:
  background: false
  validationFailureAction: Enforce
  rules:

    - name: validate-command-present
      match:
        any:
          - resources:
              kinds:
                - Pod
              annotations:
                {{ .Values.annotationKey }}: "?*"
      validate:
        message: >
          Pods annotated with {{ .Values.annotationKey }} must define a nonempty
          command on all containers. Kubernetes command replaces the Docker
          ENTRYPOINT. Omitting it will break the secrets injection wrapper.
        foreach:
          - list: request.object.spec.containers
            deny:
              conditions:
                all:
                  - key: '{{ "{{ element.command || `[]` | length(@) }}" }}'
                    operator: Equals
                    value: 0

    - name: inject-volumes
      match:
        any:
          - resources:
              kinds:
                - Pod
              annotations:
                {{ .Values.annotationKey }}: "?*"
      mutate:
        patchStrategicMerge:
          spec:
            containers:
              - (name): "*"
                volumeMounts:
                  - name: shared-memory
                    mountPath: "/mnt/shared"
                  - name: init-scripts
                    mountPath: "/scripts"
            volumes:
              - name: secrets-store-inline
                emptyDir: {}
              - name: shared-memory
                emptyDir:
                  medium: Memory
                  sizeLimit: 10Mi
              - name: init-scripts
                emptyDir: {}

    - name: inject-init-container-no-existing
      match:
        any:
          - resources:
              kinds:
                - Pod
              annotations:
                {{ .Values.annotationKey }}: "?*"
      preconditions:
        all:
          - key: '{{ "{{ request.object.spec.initContainers || `[]` | length(@) }}" }}'
            operator: Equals
            value: 0
      mutate:
        patchStrategicMerge:
          spec:
            initContainers:
              - name: secrets-parser
                image: "busybox:latest"
                command:
                  - "/bin/sh"
                  - "-c"
                  - >-
                    echo '#!/bin/sh' > /scripts/app_launcher.sh &&
                    echo 'exec "$@"' >> /scripts/app_launcher.sh &&
                    chmod +x /scripts/app_launcher.sh &&
                    echo '#!/bin/sh' > /scripts/init_parser.sh &&
                    echo 'exec "$@"' >> /scripts/init_parser.sh &&
                    chmod +x /scripts/init_parser.sh &&
                    echo '[POC] secrets-parser dummy init done'
                volumeMounts:
                  - name: secrets-store-inline
                    mountPath: "/mnt/raw-secrets"
                    readOnly: true
                  - name: shared-memory
                    mountPath: "/mnt/shared"
                  - name: init-scripts
                    mountPath: "/scripts"

    - name: inject-init-container-with-existing
      match:
        any:
          - resources:
              kinds:
                - Pod
              annotations:
                {{ .Values.annotationKey }}: "?*"
      preconditions:
        all:
          - key: '{{ "{{ request.object.spec.initContainers || `[]` | length(@) }}" }}'
            operator: GreaterThan
            value: 0
          - key: '{{ "{{ request.object.spec.initContainers[0].name }}" }}'
            operator: NotEquals
            value: "secrets-parser"
      mutate:
        patchesJson6902: |-
          - op: add
            path: /spec/initContainers/0
            value:
              name: secrets-parser
              image: "busybox:latest"
              command:
                - "/bin/sh"
                - "-c"
                - >-
                  echo '#!/bin/sh' > /scripts/app_launcher.sh &&
                  echo 'exec "$@"' >> /scripts/app_launcher.sh &&
                  chmod +x /scripts/app_launcher.sh &&
                  echo '#!/bin/sh' > /scripts/init_parser.sh &&
                  echo 'exec "$@"' >> /scripts/init_parser.sh &&
                  chmod +x /scripts/init_parser.sh &&
                  echo '[POC] secrets-parser dummy init done'
              volumeMounts:
                - name: secrets-store-inline
                  mountPath: "/mnt/raw-secrets"
                  readOnly: true
                - name: shared-memory
                  mountPath: "/mnt/shared"
                - name: init-scripts
                  mountPath: "/scripts"

    - name: inject-app-launcher
      match:
        any:
          - resources:
              kinds:
                - Pod
              annotations:
                {{ .Values.annotationKey }}: "?*"
                smaitic.com/launcher-script: "app-launcher"
      preconditions:
        all:
          - key: '{{ "{{ request.object.spec.containers[0].command || `[]` | length(@) }}" }}'
            operator: GreaterThan
            value: 0
          - key: '{{ "{{ request.object.spec.containers[0].command[0] }}" }}'
            operator: NotEquals
            value: "/scripts/app_launcher.sh"
      mutate:
        patchesJson6902: |-
          - op: add
            path: /spec/containers/0/command/0
            value: "/scripts/app_launcher.sh"

    - name: inject-init-parser
      match:
        any:
          - resources:
              kinds:
                - Pod
              annotations:
                {{ .Values.annotationKey }}: "?*"
                smaitic.com/launcher-script: "init-parser"
      preconditions:
        all:
          - key: '{{ "{{ request.object.spec.containers[0].command || `[]` | length(@) }}" }}'
            operator: GreaterThan
            value: 0
          - key: '{{ "{{ request.object.spec.containers[0].command[0] }}" }}'
            operator: NotEquals
            value: "/scripts/init_parser.sh"
      mutate:
        patchesJson6902: |-
          - op: add
            path: /spec/containers/0/command/0
            value: "/scripts/init_parser.sh"
