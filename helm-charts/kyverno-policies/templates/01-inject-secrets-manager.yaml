apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: inject-secrets-manager
spec:
  background: false
  validationFailureAction: Enforce
  rules:

    # Rule 1: VALIDATE — annotated pod must have a command defined.
    # Kubernetes `command` in pod spec replaces the Docker ENTRYPOINT — it does
    # NOT append. If a developer omits command, the secret injection wrapper
    # script will never execute.
    - name: validate-command-present
      match:
        any:
          - resources:
              kinds:
                - Pod
              annotations:
                {{ .Values.annotationKey }}: "?*"
      validate:
        message: >
          Pods annotated with {{ .Values.annotationKey }} must define a non-empty
          command on the first container. Kubernetes command replaces the Docker
          ENTRYPOINT — omitting it will break the secrets injection wrapper.
        deny:
          conditions:
            any:
              - key: "command"
                operator: AnyNotIn
                value: '{{ "{{ request.object.spec.containers[0] | keys(@) }}" }}'

    # Rule 2: MUTATE — inject shared volumes into every annotated pod.
    # Three volumes are required for secrets management:
    #   secrets-store-inline  : raw secrets from the provider (read-only)
    #   shared-memory         : parsed env files passed to the main container
    #   init-scripts          : executable launcher scripts written by secrets-parser
    # patchStrategicMerge is used here because position does not matter for volumes.
    - name: inject-volumes
      match:
        any:
          - resources:
              kinds:
                - Pod
              annotations:
                {{ .Values.annotationKey }}: "?*"
      mutate:
        patchStrategicMerge:
          spec:
            containers:
              - (name): "*"
                volumeMounts:
                  - name: shared-memory
                    mountPath: "/mnt/shared"
                  - name: init-scripts
                    mountPath: "/scripts"
            volumes:
              - name: secrets-store-inline
                emptyDir: {}
              - name: shared-memory
                emptyDir:
                  medium: Memory
                  sizeLimit: 10Mi
              - name: init-scripts
                emptyDir: {}

    # Rule 3: MUTATE — inject secrets-parser init container when the pod has
    # NO existing init containers.
    # Precondition: "initContainers" key must NOT exist in spec.
    # patchStrategicMerge is used so the container is appended; since there are
    # no existing init containers, it naturally lands at index 0.
    - name: inject-init-container-no-existing
      match:
        any:
          - resources:
              kinds:
                - Pod
              annotations:
                {{ .Values.annotationKey }}: "?*"
      preconditions:
        all:
          - key: "initContainers"
            operator: AnyNotIn
            value: '{{ "{{ request.object.spec | keys(@) }}" }}'
      mutate:
        patchStrategicMerge:
          spec:
            initContainers:
              - name: secrets-parser
                image: "busybox:latest"
                command:
                  - "/bin/sh"
                  - "-c"
                  - >-
                    echo '#!/bin/sh' > /scripts/app_launcher.sh &&
                    echo 'exec "$@"' >> /scripts/app_launcher.sh &&
                    chmod +x /scripts/app_launcher.sh &&
                    echo '#!/bin/sh' > /scripts/init_parser.sh &&
                    echo 'exec "$@"' >> /scripts/init_parser.sh &&
                    chmod +x /scripts/init_parser.sh &&
                    echo '[POC] secrets-parser dummy init done'
                volumeMounts:
                  - name: secrets-store-inline
                    mountPath: "/mnt/raw-secrets"
                    readOnly: true
                  - name: shared-memory
                    mountPath: "/mnt/shared"
                  - name: init-scripts
                    mountPath: "/scripts"

    # Rule 4: MUTATE — inject secrets-parser at index 0 when the pod ALREADY
    # HAS existing init containers.
    # Precondition checks two things:
    #   a) "initContainers" key exists in spec (pod has at least one)
    #   b) The first init container is NOT already secrets-parser (idempotency guard)
    # patchesJson6902 with op:add at path /spec/initContainers/0 forces
    # secrets-parser to the front of the array, shifting all others down.
    - name: inject-init-container-with-existing
      match:
        any:
          - resources:
              kinds:
                - Pod
              annotations:
                {{ .Values.annotationKey }}: "?*"
      preconditions:
        all:
          - key: "initContainers"
            operator: AnyIn
            value: '{{ "{{ request.object.spec | keys(@) }}" }}'
          - key: '{{ "{{ request.object.spec.initContainers[0].name }}" }}'
            operator: NotEquals
            value: "secrets-parser"
      mutate:
        patchesJson6902: |-
          - op: add
            path: /spec/initContainers/0
            value:
              name: secrets-parser
              image: "busybox:latest"
              command:
                - "/bin/sh"
                - "-c"
                - >-
                  echo '#!/bin/sh' > /scripts/app_launcher.sh &&
                  echo 'exec "$@"' >> /scripts/app_launcher.sh &&
                  chmod +x /scripts/app_launcher.sh &&
                  echo '#!/bin/sh' > /scripts/init_parser.sh &&
                  echo 'exec "$@"' >> /scripts/init_parser.sh &&
                  chmod +x /scripts/init_parser.sh &&
                  echo '[POC] secrets-parser dummy init done'
              volumeMounts:
                - name: secrets-store-inline
                  mountPath: "/mnt/raw-secrets"
                  readOnly: true
                - name: shared-memory
                  mountPath: "/mnt/shared"
                - name: init-scripts
                  mountPath: "/scripts"

    # Rule 5: MUTATE — prepend /scripts/app_launcher.sh at command[0].
    # Triggered only when annotation smaitic.com/launcher-script=app-launcher.
    # Preconditions:
    #   a) "command" key must exist in the first container (Rule 1 guarantees this)
    #   b) command[0] must not already be the launcher (idempotency guard)
    - name: inject-app-launcher
      match:
        any:
          - resources:
              kinds:
                - Pod
              annotations:
                {{ .Values.annotationKey }}: "?*"
                smaitic.com/launcher-script: "app-launcher"
      preconditions:
        all:
          - key: "command"
            operator: AnyIn
            value: '{{ "{{ request.object.spec.containers[0] | keys(@) }}" }}'
          - key: '{{ "{{ request.object.spec.containers[0].command[0] }}" }}'
            operator: NotEquals
            value: "/scripts/app_launcher.sh"
      mutate:
        patchesJson6902: |-
          - op: add
            path: /spec/containers/0/command/0
            value: "/scripts/app_launcher.sh"

    # Rule 6: MUTATE — prepend /scripts/init_parser.sh at command[0].
    # Triggered only when annotation smaitic.com/launcher-script=init-parser.
    # init_parser.sh is written to the /scripts volume by secrets-parser (Rule 3/4).
    - name: inject-init-parser
      match:
        any:
          - resources:
              kinds:
                - Pod
              annotations:
                {{ .Values.annotationKey }}: "?*"
                smaitic.com/launcher-script: "init-parser"
      preconditions:
        all:
          - key: "command"
            operator: AnyIn
            value: '{{ "{{ request.object.spec.containers[0] | keys(@) }}" }}'
          - key: '{{ "{{ request.object.spec.containers[0].command[0] }}" }}'
            operator: NotEquals
            value: "/scripts/init_parser.sh"
      mutate:
        patchesJson6902: |-
          - op: add
            path: /spec/containers/0/command/0
            value: "/scripts/init_parser.sh"
