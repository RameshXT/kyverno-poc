apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: inject-command-prefix
  annotations:
    policies.kyverno.io/title: "Inject App Launcher Command Prefix"
    policies.kyverno.io/category: "Workload Management"
    policies.kyverno.io/subject: "Pod, Container"
spec:
  background: false
  rules:
    # Rule 1: App launcher script for backend/Java/JS services
    - name: inject-app-launcher
      match:
        any:
          - resources:
              kinds:
                - Pod
              annotations:
                {{ .Values.annotationKey }}: "?*"
                smaitic.com/launcher-script: "app-launcher"
      preconditions:
        all:
          - key: "command"
            operator: AnyIn
            value: '{{ "{{ request.object.spec.containers[0] | keys(@) }}" }}'
          - key: '{{ "{{ request.object.spec.containers[0].command[0] }}" }}'
            operator: NotEquals
            value: "/scripts/app_launcher.sh"
      mutate:
        patchesJson6902: |-
          - op: add
            path: /spec/containers/0/command/0
            value: "/scripts/app_launcher.sh"

    # Rule 2: Init parser script for secrets/init-heavy services
    - name: inject-init-parser
      match:
        any:
          - resources:
              kinds:
                - Pod
              annotations:
                {{ .Values.annotationKey }}: "?*"
                smaitic.com/launcher-script: "init-parser"
      preconditions:
        all:
          - key: "command"
            operator: AnyIn
            value: '{{ "{{ request.object.spec.containers[0] | keys(@) }}" }}'
          - key: '{{ "{{ request.object.spec.containers[0].command[0] }}" }}'
            operator: NotEquals
            value: "/scripts/init_parser.sh"
      mutate:
        patchesJson6902: |-
          - op: add
            path: /spec/containers/0/command/0
            value: "/scripts/init_parser.sh"
