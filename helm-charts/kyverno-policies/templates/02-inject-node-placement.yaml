apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: inject-node-placement
  annotations:
    policies.kyverno.io/title: "Inject Node Placement (nodeSelector and Toleration)"
    policies.kyverno.io/category: "Pod Placement"
    policies.kyverno.io/subject: "Pod, nodeSelector, Toleration"
spec:
  background: false
  rules:
    - name: inject-node-placement
      match:
        any:
          - resources:
              kinds:
                - Pod
              annotations:
                smaitic.com/kyverno/policy/node-placement: "?*"
      mutate:
        patchStrategicMerge:
          spec:
            nodeSelector:
              demo.smaitic.com/role: '{{ "{{ request.object.metadata.annotations.\"smaitic.com/kyverno/policy/node-placement\" }}" }}'
            tolerations:
              - key: demo.smaitic.com/reserved-for
                value: '{{ "{{ request.object.metadata.annotations.\"smaitic.com/kyverno/policy/node-placement\" }}" }}'
                effect: NoSchedule
                operator: Equal
