apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: validate-command-defined
  annotations:
    policies.kyverno.io/title: "Validate Command Defined on Annotated Pods"
    policies.kyverno.io/category: "Secrets Management"
    policies.kyverno.io/subject: "Pod, Command Validation"
spec:
  background: false
  validationFailureAction: Enforce
  rules:
    - name: require-command-on-annotated-pods
      match:
        any:
          - resources:
              kinds:
                - Pod
              annotations:
                {{ .Values.annotationKey }}: "?*"
      validate:
        message: "Pods annotated with {{ .Values.annotationKey }} must define a command on the first container."
        deny:
          conditions:
            any:
              - key: "command"
                operator: AnyNotIn
                value: '{{ "{{ request.object.spec.containers[0] | keys(@) }}" }}'
