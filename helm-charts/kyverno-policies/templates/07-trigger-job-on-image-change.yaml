apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: trigger-job-on-image-change
  annotations:
    policies.kyverno.io/title: "Trigger Migration Job on Image Change"
    policies.kyverno.io/category: "Job Trigger"
    policies.kyverno.io/subject: "Deployment, Job"
spec:
  background: false
  rules:
    - name: generate-migration-job
      match:
        any:
          - resources:
              kinds:
                - Deployment
              namespaces:
                - {{ .Values.targetNamespace }}
              annotations:
                {{ .Values.annotationKey }}: "?*"
      preconditions:
        all:
          - key: '{{ "{{ request.operation }}" }}'
            operator: Equals
            value: UPDATE
          - key: '{{ "{{ request.object.spec.template.spec.containers[0].image }}" }}'
            operator: NotEquals
            value: '{{ "{{ request.oldObject.spec.template.spec.containers[0].image }}" }}'
      generate:
        synchronize: false
        apiVersion: batch/v1
        kind: Job
        name: '{{ "{{ request.object.metadata.name }}-migration-{{ request.object.metadata.resourceVersion }}" }}'
        namespace: '{{ "{{ request.object.metadata.namespace }}" }}'
        data:
          metadata:
            labels:
              triggered-by: kyverno
              deployment: '{{ "{{ request.object.metadata.name }}" }}'
            annotations:
              image: '{{ "{{ request.object.spec.template.spec.containers[0].image }}" }}'
          spec:
            backoffLimit: 0
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: migration
                    image: '{{ "{{ request.object.spec.template.spec.containers[0].image }}" }}'
                    command:
                      - "/bin/sh"
                      - "-c"
                      - 'echo "[POC] Running migration job for {{ "{{ request.object.metadata.name }}" }}" && sleep 5'
