apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: inject-secrets-parser
  annotations:
    policies.kyverno.io/title: "Inject Secrets Parser and Volumes"
    policies.kyverno.io/category: "Secrets Management"
    policies.kyverno.io/subject: "Pod, InitContainer, Volume"
spec:
  background: false
  rules:

    # Rule 1: Always inject volumes (order does not matter for volumes)
    - name: inject-volumes
      match:
        any:
          - resources:
              kinds:
                - Pod
              annotations:
                smaitic.com/inject-secrets-poc: "?*"
      mutate:
        patchStrategicMerge:
          spec:
            volumes:
              - name: secrets-store-inline
                emptyDir: {}
              - name: shared-memory
                emptyDir:
                  medium: Memory
                  sizeLimit: 10Mi
              - name: init-scripts
                emptyDir: {}

    # Rule 2: Pod has NO initContainers — inject secrets-parser (append = position 0)
    - name: inject-init-no-existing
      match:
        any:
          - resources:
              kinds:
                - Pod
              annotations:
                smaitic.com/inject-secrets-poc: "?*"
      preconditions:
        all:
          - key: "initContainers"
            operator: AnyNotIn
            value: "{{ request.object.spec | keys(@) }}"
      mutate:
        patchStrategicMerge:
          spec:
            initContainers:
              - name: secrets-parser
                image: "busybox:latest"
                command:
                  - "/bin/sh"
                  - "-c"
                  - "echo '[POC] secrets-parser dummy init done' && sleep 2"
                volumeMounts:
                  - name: secrets-store-inline
                    mountPath: "/mnt/raw-secrets"
                    readOnly: true
                  - name: shared-memory
                    mountPath: "/mnt/shared"
                  - name: init-scripts
                    mountPath: "/scripts"

    # Rule 3: Pod HAS initContainers — insert secrets-parser at position 0
    - name: inject-init-with-existing
      match:
        any:
          - resources:
              kinds:
                - Pod
              annotations:
                smaitic.com/inject-secrets-poc: "?*"
      preconditions:
        all:
          - key: "initContainers"
            operator: AnyIn
            value: "{{ request.object.spec | keys(@) }}"
          - key: "{{ request.object.spec.initContainers[0].name }}"
            operator: NotEquals
            value: "secrets-parser"
      mutate:
        patchesJson6902: |-
          - op: add
            path: /spec/initContainers/0
            value:
              name: secrets-parser
              image: "busybox:latest"
              command:
                - "/bin/sh"
                - "-c"
                - "echo '[POC] secrets-parser dummy init done' && sleep 2"
              volumeMounts:
                - name: secrets-store-inline
                  mountPath: "/mnt/raw-secrets"
                  readOnly: true
                - name: shared-memory
                  mountPath: "/mnt/shared"
                - name: init-scripts
                  mountPath: "/scripts"

    # Rule 4: Insert /scripts/app_launcher.sh at command position 0 (first container only)
    - name: inject-command-prefix
      match:
        any:
          - resources:
              kinds:
                - Pod
              annotations:
                smaitic.com/inject-secrets-poc: "?*"
      preconditions:
        all:
          - key: "command"
            operator: AnyIn
            value: "{{ request.object.spec.containers[0] | keys(@) }}"
          - key: "{{ request.object.spec.containers[0].command[0] }}"
            operator: NotEquals
            value: "/scripts/app_launcher.sh"
      mutate:
        patchesJson6902: |-
          - op: add
            path: /spec/containers/0/command/0
            value: "/scripts/app_launcher.sh"

    # Rule 5: Inject nodeSelector + toleration for annotated pods
    - name: inject-node-placement
      match:
        any:
          - resources:
              kinds:
                - Pod
              annotations:
                smaitic.com/inject-secrets-poc: "?*"
      mutate:
        patchStrategicMerge:
          spec:
            nodeSelector:
              dummy.smaitic.com/role: poc-worker
            tolerations:
              - key: dummy.smaitic.com/reserved-for
                value: poc-worker
                effect: NoSchedule
                operator: Equal

    # Rule 6: Inject default CPU and memory resources for annotated pods
    - name: inject-resources
      match:
        any:
          - resources:
              kinds:
                - Pod
              annotations:
                smaitic.com/inject-secrets-poc: "?*"
      mutate:
        patchStrategicMerge:
          spec:
            containers:
              - (name): "*"
                resources:
                  requests:
                    cpu: "100m"
                    memory: "256Mi"
                  limits:
                    cpu: "500m"
                    memory: "512Mi"
